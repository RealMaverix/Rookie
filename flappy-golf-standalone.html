<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Golf - Tap to Keep the Ball in the Air!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-size: 2.5em;
        }

        .game-wrapper {
            position: relative;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 100%);
            cursor: pointer;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #FFD700;
        }

        .overlay p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .score-display {
            margin-top: 20px;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .controls {
            margin-top: 15px;
            color: white;
            font-size: 1.1em;
            opacity: 0.9;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 2em;
            }

            #gameCanvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏌️ Flappy Golf ⛳</h1>
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
            <div id="startScreen" class="overlay">
                <h2>Flappy Golf</h2>
                <p>Click or press SPACE to make the golf ball fly!</p>
                <p>Avoid the golf clubs!</p>
                <button id="startBtn">Start Game</button>
            </div>
            <div id="gameOverScreen" class="overlay hidden">
                <h2>Game Over!</h2>
                <p>Score: <span id="finalScore">0</span></p>
                <p>Best: <span id="bestScore">0</span></p>
                <button id="restartBtn">Play Again</button>
            </div>
        </div>
        <div class="score-display">
            <p>Score: <span id="currentScore">0</span></p>
        </div>
        <div class="controls">
            <p>🖱️ Click or press SPACE to jump</p>
        </div>
    </div>
    <script>
        // Game Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let gameState = 'waiting'; // waiting, playing, gameOver
        let score = 0;
        let bestScore = localStorage.getItem('bestScore') || 0;
        let frames = 0;

        // Golf Ball Object
        const ball = {
            x: 100,
            y: canvas.height / 2,
            radius: 12,
            velocity: 0,
            gravity: 0.5,
            jump: -8,
            rotation: 0,

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Draw golf ball
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ddd';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Add dimple pattern
                ctx.fillStyle = '#eee';
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 / 8) * i;
                    const dimpleX = Math.cos(angle) * (this.radius * 0.5);
                    const dimpleY = Math.sin(angle) * (this.radius * 0.5);
                    ctx.beginPath();
                    ctx.arc(dimpleX, dimpleY, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            },

            update() {
                if (gameState === 'playing') {
                    this.velocity += this.gravity;
                    this.y += this.velocity;
                    this.rotation += 0.1;

                    // Check boundaries
                    if (this.y + this.radius > canvas.height || this.y - this.radius < 0) {
                        endGame();
                    }
                }
            },

            flap() {
                if (gameState === 'playing') {
                    this.velocity = this.jump;
                }
            },

            reset() {
                this.y = canvas.height / 2;
                this.velocity = 0;
                this.rotation = 0;
            }
        };

        // Golf Club Obstacles
        const clubs = [];
        const clubWidth = 60;
        const clubGap = 160;
        const clubSpeed = 2;

        class GolfClub {
            constructor() {
                this.x = canvas.width;
                this.gapY = Math.random() * (canvas.height - clubGap - 100) + 50;
                this.scored = false;
            }

            draw() {
                // Draw top club (upside down)
                this.drawClub(this.x, 0, clubWidth, this.gapY, true);

                // Draw bottom club
                this.drawClub(this.x, this.gapY + clubGap, clubWidth, canvas.height - (this.gapY + clubGap), false);
            }

            drawClub(x, y, width, height, isTop) {
                ctx.save();

                // Club shaft
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x + width / 3, y, width / 3, height);

                // Club head
                const headHeight = 40;
                const headY = isTop ? y + height - headHeight : y;

                ctx.fillStyle = '#C0C0C0';
                ctx.fillRect(x, headY, width, headHeight);

                // Club head shine
                ctx.fillStyle = '#E8E8E8';
                ctx.fillRect(x + 5, headY + 5, width - 10, 10);

                // Grip
                const gripHeight = 30;
                const gripY = isTop ? y : y + height - gripHeight;
                ctx.fillStyle = '#333';
                ctx.fillRect(x + width / 3, gripY, width / 3, gripHeight);

                ctx.restore();
            }

            update() {
                this.x -= clubSpeed;
            }

            isOffScreen() {
                return this.x + clubWidth < 0;
            }

            collidesWith(ball) {
                // Check if ball hits top or bottom club
                const ballLeft = ball.x - ball.radius;
                const ballRight = ball.x + ball.radius;
                const ballTop = ball.y - ball.radius;
                const ballBottom = ball.y + ball.radius;

                const clubLeft = this.x;
                const clubRight = this.x + clubWidth;

                // Check horizontal overlap
                if (ballRight > clubLeft && ballLeft < clubRight) {
                    // Check if ball hits top or bottom club
                    if (ballTop < this.gapY || ballBottom > this.gapY + clubGap) {
                        return true;
                    }
                }

                return false;
            }

            updateScore(ball) {
                if (!this.scored && ball.x > this.x + clubWidth) {
                    this.scored = true;
                    score++;
                    updateScoreDisplay();
                }
            }
        }

        // Game Functions
        function spawnClub() {
            clubs.push(new GolfClub());
        }

        function updateScoreDisplay() {
            document.getElementById('currentScore').textContent = score;
        }

        function startGame() {
            gameState = 'playing';
            score = 0;
            frames = 0;
            clubs.length = 0;
            ball.reset();
            updateScoreDisplay();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
        }

        function endGame() {
            gameState = 'gameOver';

            // Update best score
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('bestScore', bestScore);
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('bestScore').textContent = bestScore;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function drawBackground() {
            // Sky gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#90EE90');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            const cloudOffset = (frames * 0.5) % (canvas.width + 100);
            drawCloud(cloudOffset - 100, 80);
            drawCloud(cloudOffset + 150, 150);
            drawCloud(cloudOffset + 50, 220);
        }

        function drawCloud(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.arc(x + 25, y, 25, 0, Math.PI * 2);
            ctx.arc(x + 50, y, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            // Clear and draw background
            drawBackground();

            if (gameState === 'playing') {
                frames++;

                // Spawn new clubs
                if (frames % 120 === 0) {
                    spawnClub();
                }

                // Update and draw clubs
                for (let i = clubs.length - 1; i >= 0; i--) {
                    clubs[i].update();
                    clubs[i].draw();
                    clubs[i].updateScore(ball);

                    // Check collision
                    if (clubs[i].collidesWith(ball)) {
                        endGame();
                    }

                    // Remove off-screen clubs
                    if (clubs[i].isOffScreen()) {
                        clubs.splice(i, 1);
                    }
                }
            } else if (gameState === 'waiting') {
                // Draw static clubs for visual
                if (clubs.length === 0) {
                    clubs.push(new GolfClub());
                    clubs[0].x = 300;
                }
                clubs[0].draw();
            }

            // Update and draw ball
            ball.update();
            ball.draw();

            requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        canvas.addEventListener('click', () => {
            ball.flap();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                ball.flap();
            }
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Initialize
        updateScoreDisplay();
        document.getElementById('bestScore').textContent = bestScore;
        gameLoop();
    </script>
</body>
</html>
